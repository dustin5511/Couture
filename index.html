<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sophie's Tea Time</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #070a1c; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", monospace; overflow: hidden;
    touch-action: manipulation;
  }
  #wrap { position: relative; width: 100%; max-width: 880px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 6px; }
  #touch {
    position: absolute; inset: 0; display: none; pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  @media (pointer: coarse) { #touch { display: block; } }
  .tbtn {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    color: #fff; font-size: 26px; line-height: 60px; text-align: center;
    pointer-events: auto; bottom: 14px;
  }
  #btnL { left: 14px; }  #btnR { left: 92px; }
  #btnU { right: 92px; bottom: 60px; } #btnD { right: 92px; bottom: 0px; height: 52px; line-height: 48px;}
  #btnJ { right: 14px; bottom: 24px; background: rgba(255,220,120,0.2); border-color: rgba(255,220,120,0.6);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="880" height="720"></canvas>
  <div id="touch">
    <div class="tbtn" id="btnL">&#9664;</div>
    <div class="tbtn" id="btnR">&#9654;</div>
    <div class="tbtn" id="btnU">&#9650;</div>
    <div class="tbtn" id="btnD">&#9660;</div>
    <div class="tbtn" id="btnJ">&#10548;</div>
  </div>
</div>
<script>
"use strict";
// roundRect shim for older browsers (pre-2023 Safari/Chrome)
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r || 0, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
const cv = document.getElementById("game");
const g  = cv.getContext("2d");
const W = 880, H = 720;

/* ---------------- world geometry ---------------- */
function P(x1, y1, x2, y2, dir, fall) {
  return { x1, y1, x2, y2, dir, fall,
           y(x) { return this.y1 + (x - this.x1) * (this.y2 - this.y1) / (this.x2 - this.x1); } };
}
// dir: which way cups roll (+1 right, -1 left). fall: which end they drop off.
const plats = [
  P(  0, 672, 880, 688, +1, "exit"),   // 0 ground — cups exit off-screen right
  P( 30, 598, 880, 582, -1, "left"),
  P(  0, 488, 850, 505, +1, "right"),
  P( 30, 415, 880, 398, -1, "left"),
  P(  0, 322, 850, 338, +1, "right"),
  P( 30, 250, 880, 232, -1, "left"),   // 5 top run
  P(320, 168, 560, 168,  0, null),     // 6 penthouse — the Prez stands here
];
// ladders: {x, top platform index, bottom platform index}
const ladders = [
  { x: 800, t: 1, b: 0 }, { x: 300, t: 1, b: 0 },
  { x:  90, t: 2, b: 1 },
  { x: 770, t: 3, b: 2 }, { x: 350, t: 3, b: 2 },
  { x:  90, t: 4, b: 3 },
  { x: 750, t: 5, b: 4 }, { x: 200, t: 5, b: 4 },
  { x: 440, t: 6, b: 5 },
].map(L => ({ x: L.x, top: plats[L.t].y(L.x), bot: plats[L.b].y(L.x) }));

const stars = [];
{ let s = 9301; const rnd = () => (s = (s * 49297 + 233) % 233280) / 233280;
  for (let i = 0; i < 90; i++) stars.push({ x: rnd() * W, y: rnd() * 560, r: rnd() * 1.4 + 0.4, tw: rnd() * 6.28 }); }

/* ---------------- state ---------------- */
const keys = {};
let state = "title";          // title | play | dying | toss | gameover
let round, score, lives, maxPlat, invT, deadT, tossT, spawnT, frame = 0, muted = false, paused = false;
const player = { x: 0, y: 0, vx: 0, vy: 0, dir: 1, grounded: false, plat: 0, climbing: null, phase: 0 };
const PREZ_X = 470;           // where the Prez stands on the penthouse
const flung = { x: 0, y: 0, vx: 0, vy: 0, rot: 0 };   // the Prez, once airborne
let cups = [], floaters = [];

function resetPlayer() {
  player.x = 40; player.y = plats[0].y(40);
  player.vx = 0; player.vy = 0; player.dir = 1;
  player.grounded = true; player.plat = 0; player.climbing = null;
}
function startRound(n) {
  round = n; cups = []; floaters = [];
  maxPlat = 0; spawnT = 70; invT = 90; resetPlayer(); state = "play";
}
function newGame() { score = 0; lives = 3; startRound(1); }

/* ---------------- audio ---------------- */
let ac = null;
function beep(f, dur, type, vol, slide) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type || "square"; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, ac.currentTime + dur);
    gn.gain.value = vol || 0.05;
    gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(gn); gn.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(240, 0.15, "square", 0.05, 480),
  step: () => beep(120, 0.05, "triangle", 0.02),
  hit:  () => { beep(320, 0.3, "sawtooth", 0.07, 60); },
  score:() => beep(660, 0.12, "square", 0.045, 880),
  win:  () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.35, "triangle", 0.06), i * 160)); },
  toss: () => beep(900, 0.12, "square", 0.03, 200),
  fling:() => beep(180, 0.5, "sawtooth", 0.06, 900),
};

/* ---------------- input ---------------- */
addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k)) e.preventDefault();
  if (k === "m" || k === "M") muted = !muted;
  if (k === "p" || k === "P") paused = !paused;
  if (state === "title"    && (k === "Enter" || k === " ")) { newGame(); return; }
  if (state === "gameover" && (k === "Enter" || k === " ")) { state = "title"; return; }
  keys[k] = true;
});
addEventListener("keyup", e => { keys[e.key] = false; });
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const on  = e => { e.preventDefault(); keys[key] = true;
                     if (state === "title") newGame(); else if (state === "gameover") state = "title"; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener("pointerdown", on); el.addEventListener("pointerup", off);
  el.addEventListener("pointerleave", off); el.addEventListener("pointercancel", off);
}
bindBtn("btnL", "ArrowLeft"); bindBtn("btnR", "ArrowRight");
bindBtn("btnU", "ArrowUp");   bindBtn("btnD", "ArrowDown"); bindBtn("btnJ", " ");
cv.addEventListener("pointerdown", () => { if (state === "title") newGame(); else if (state === "gameover") state = "title"; });

const left  = () => keys["ArrowLeft"]  || keys["a"] || keys["A"];
const right = () => keys["ArrowRight"] || keys["d"] || keys["D"];
const up    = () => keys["ArrowUp"]    || keys["w"] || keys["W"];
const down  = () => keys["ArrowDown"]  || keys["s"] || keys["S"];
const jump  = () => keys[" "];

/* ---------------- update ---------------- */
function updatePlayer() {
  const p = player;
  if (p.climbing) {
    const L = p.climbing;
    p.x += (L.x - p.x) * 0.4;
    if (up())   p.y -= 2.0;
    if (down()) p.y += 2.0;
    if (up() || down()) p.phase += 0.15;
    if (jump()) { p.climbing = null; p.vy = -4; keys[" "] = false; }
    if (p.y <= L.top) { p.y = L.top; p.climbing = null; p.grounded = true; }
    if (p.y >= L.bot) { p.y = L.bot; p.climbing = null; p.grounded = true; }
  } else {
    let mv = 0;
    if (left())  { mv -= 2.7; p.dir = -1; }
    if (right()) { mv += 2.7; p.dir =  1; }
    p.x += mv;
    p.x = Math.max(12, Math.min(W - 12, p.x));
    if (mv !== 0 && p.grounded) { p.phase += 0.22; if ((p.phase | 0) % 4 === 0 && Math.random() < 0.05) sfx.step(); }

    if (jump() && p.grounded) { p.vy = -8.8; p.grounded = false; sfx.jump(); keys[" "] = false; }

    p.vy += 0.5; if (p.vy > 12) p.vy = 12;
    const prevY = p.y;
    p.y += p.vy;

    // land on / stick to platforms
    p.grounded = false;
    let best = null, bestD = 15;
    for (let i = 0; i < plats.length; i++) {
      const pl = plats[i];
      if (p.x < pl.x1 - 4 || p.x > pl.x2 + 4) continue;
      const ys = pl.y(p.x);
      if (p.vy >= 0 && prevY <= ys + 12 && p.y >= ys - 6) {
        const d = Math.abs(p.y - ys);
        if (d < bestD) { bestD = d; best = i; }
      }
    }
    if (best !== null) {
      p.y = plats[best].y(p.x); p.vy = 0; p.grounded = true; p.plat = best;
      if (best > maxPlat && best < 6) {
        score += 150 * (best - maxPlat); maxPlat = best; sfx.score();
        floaters.push({ x: p.x, y: p.y - 44, t: 60, text: "+" + 150 * (best - maxPlat) });
      }
    }

    // grab ladders
    for (const L of ladders) {
      if (Math.abs(p.x - L.x) > 16) continue;
      if (up() && p.y > L.top + 2 && p.y < L.bot + 20) { p.climbing = L; p.vy = 0; break; }
      if (down() && p.grounded && Math.abs(p.y - L.top) < 8) { p.climbing = L; p.y = L.top + 6; p.vy = 0; break; }
    }

    // reached the Prez!
    if (p.grounded && p.plat === 6) {
      state = "toss"; tossT = 0; cups = [];
      p.x = 430; p.y = 168; p.dir = 1;
      score += 1000 + lives * 250; sfx.win();
    }
  }
}

function updateCups() {
  // the Prez lobs a fresh cup when the timer runs out
  if (--spawnT <= 0) {
    spawnT = Math.max(60, 155 - round * 16) + Math.random() * 45;
    cups.push({ x: PREZ_X + 22, y: 118, vx: 2.8 + Math.random() * 2 + round * 0.15, vy: -2.2,
                pi: -1, falling: true, thrown: true, r: 15, ang: 0, jumped: false });
    sfx.toss();
  }
  const accel = 0.035 + round * 0.004;
  const vmax  = Math.min(4.2, 2.6 + round * 0.25);
  for (const c of cups) {
    if (!c.falling) {
      const pl = plats[c.pi];
      c.vx += pl.dir * accel;
      c.vx = Math.max(-vmax, Math.min(vmax, c.vx));
      c.x += c.vx;
      c.ang += c.vx / c.r;
      if (pl.fall === "left"  && c.x < pl.x1) { c.falling = true; c.vy = 0; }
      else if (pl.fall === "right" && c.x > pl.x2) { c.falling = true; c.vy = 0; }
      else if (c.x >= pl.x1 && c.x <= pl.x2) c.y = pl.y(c.x) - c.r;
    } else {
      c.vy += 0.42;
      const prevB = c.y + c.r;
      c.y += c.vy;
      c.x += c.vx * (c.thrown ? 1 : 0.25);       // full arc when freshly lobbed
      c.ang += c.vx / c.r * 0.5;
      if (!c.thrown) c.x = Math.max(6, Math.min(874, c.x));
      for (let i = 0; i < plats.length; i++) {
        const pl = plats[i];
        if (i === 6 || c.x < pl.x1 || c.x > pl.x2) continue;   // never land back on the penthouse
        const ys = pl.y(c.x);
        if (c.vy > 0 && prevB <= ys + 8 && c.y + c.r >= ys) {
          c.y = ys - c.r; c.falling = false; c.thrown = false; c.pi = i; c.vy = 0;
          c.vx = pl.dir * Math.max(Math.abs(c.vx), 1.5);
          break;
        }
      }
    }
  }
  cups = cups.filter(c => c.x < W + 60 && c.x > -60 && c.y < H + 60);
}

function checkCollisions() {
  if (invT > 0) return;
  const p = player;
  for (const c of cups) {
    // cup circle vs player box (feet at p.y, ~22 wide, 30 tall)
    const nx = Math.max(p.x - 10, Math.min(c.x, p.x + 10));
    const ny = Math.max(p.y - 30, Math.min(c.y, p.y));
    const dx = c.x - nx, dy = c.y - ny;
    if (dx * dx + dy * dy < (c.r - 3) * (c.r - 3)) {
      state = "dying"; deadT = 70; lives--; sfx.hit();
      return;
    }
    // jumped clean over a cup → bonus
    if (!c.jumped && !p.grounded && !p.climbing && Math.abs(c.x - p.x) < 26 && c.y - c.r > p.y + 6) {
      c.jumped = true; score += 50; sfx.score();
      floaters.push({ x: c.x, y: c.y - 30, t: 50, text: "+50" });
    }
  }
}

function update() {
  frame++;
  if (state === "play") {
    if (invT > 0) invT--;
    updatePlayer();
    if (state === "play") { updateCups(); checkCollisions(); }
  } else if (state === "dying") {
    updateCups();
    if (--deadT <= 0) {
      if (lives <= 0) state = "gameover";
      else { resetPlayer(); invT = 120; state = "play"; }
    }
  } else if (state === "toss") {
    tossT++;
    if (tossT === 46) {                      // launch!
      flung.x = 430; flung.y = 116; flung.vx = 6; flung.vy = -7.5; flung.rot = 0;
      sfx.fling();
    }
    if (tossT > 45) {
      flung.vy += 0.45;
      flung.x += flung.vx; flung.y += flung.vy; flung.rot += 0.26;
    }
    if (tossT > 230) startRound(round + 1);
  }
  for (const f of floaters) { f.y -= 0.7; f.t--; }
  floaters = floaters.filter(f => f.t > 0);
}

/* ---------------- drawing ---------------- */
function drawBackground() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#0b1030"); gr.addColorStop(0.55, "#1a1f4d"); gr.addColorStop(1, "#2a2350");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const s of stars) {
    const a = 0.4 + 0.6 * Math.abs(Math.sin(frame * 0.02 + s.tw));
    g.fillStyle = "rgba(255,255,230," + a.toFixed(2) + ")";
    g.fillRect(s.x, s.y, s.r * 2, s.r * 2);
  }
  // crescent moon
  g.fillStyle = "#f5f0d0";
  g.beginPath(); g.arc(90, 80, 34, 0, 7); g.fill();
  g.fillStyle = "#0b1030";
  g.beginPath(); g.arc(104, 72, 30, 0, 7); g.fill();
}

function drawLadders() {
  for (const L of ladders) {
    g.strokeStyle = "#c9a06a"; g.lineWidth = 4;
    g.beginPath();
    g.moveTo(L.x - 9, L.top); g.lineTo(L.x - 9, L.bot + 4);
    g.moveTo(L.x + 9, L.top); g.lineTo(L.x + 9, L.bot + 4);
    g.stroke();
    g.lineWidth = 3; g.strokeStyle = "#b08850";
    for (let y = L.top + 6; y < L.bot; y += 13) {
      g.beginPath(); g.moveTo(L.x - 9, y); g.lineTo(L.x + 9, y); g.stroke();
    }
  }
}

function drawPlatforms() {
  for (const pl of plats) {
    g.fillStyle = "#7a4a2e";
    g.beginPath();
    g.moveTo(pl.x1, pl.y1); g.lineTo(pl.x2, pl.y2);
    g.lineTo(pl.x2, pl.y2 + 20); g.lineTo(pl.x1, pl.y1 + 20);
    g.closePath(); g.fill();
    g.strokeStyle = "#a4713f"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(pl.x1, pl.y1 + 1); g.lineTo(pl.x2, pl.y2 + 1); g.stroke();
    g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 2;
    for (let x = pl.x1 + 40; x < pl.x2; x += 44) {
      const y = pl.y(x);
      g.beginPath(); g.moveTo(x, y + 3); g.lineTo(x, y + 19); g.stroke();
    }
  }
}

// A giant cup of tea, upright on its saucer, sliding along the ramps.
// Leans slightly into its direction of travel; tea sloshes; steam rises.
function drawCup(c) {
  const lean = Math.max(-0.16, Math.min(0.16, (c.vx || 0) * 0.045));
  const slosh = Math.max(-3, Math.min(3, -(c.vx || 0) * 0.8));
  g.save(); g.translate(c.x, c.y); g.rotate(lean);
  // saucer
  g.fillStyle = "#f4f1ea";
  g.beginPath(); g.ellipse(0, c.r - 3, c.r, 3.6, 0, 0, 7); g.fill();
  g.strokeStyle = "#b9b3a6"; g.lineWidth = 1.6;
  g.beginPath(); g.ellipse(0, c.r - 3, c.r, 3.6, 0, 0, 7); g.stroke();
  // cup body (tapers toward the foot)
  g.fillStyle = "#f4f1ea";
  g.beginPath();
  g.moveTo(-11, -c.r + 7);
  g.lineTo(11, -c.r + 7);
  g.quadraticCurveTo(10, 2, 7, c.r - 5);
  g.lineTo(-7, c.r - 5);
  g.quadraticCurveTo(-10, 2, -11, -c.r + 7);
  g.closePath(); g.fill();
  g.strokeStyle = "#b9b3a6"; g.lineWidth = 1.6; g.stroke();
  // blue china stripe
  g.strokeStyle = "#3f5fa8"; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-10.4, -c.r + 11); g.lineTo(10.4, -c.r + 11); g.stroke();
  // handle
  g.strokeStyle = "#f4f1ea"; g.lineWidth = 3.5;
  g.beginPath(); g.arc(12.5, -2, 5.5, Math.PI * 0.55, Math.PI * 1.45, true); g.stroke();
  // rim + tea (tea leans against the slosh)
  g.fillStyle = "#f4f1ea";
  g.beginPath(); g.ellipse(0, -c.r + 7, 11, 3.4, 0, 0, 7); g.fill();
  g.strokeStyle = "#b9b3a6"; g.lineWidth = 1.4; g.stroke();
  g.fillStyle = "#a5691e";
  g.beginPath(); g.ellipse(slosh * 0.4, -c.r + 7, 8.6, 2.5, slosh * 0.03, 0, 7); g.fill();
  g.fillStyle = "rgba(255,235,190,0.55)";
  g.beginPath(); g.ellipse(slosh * 0.4 - 2.5, -c.r + 6.6, 3, 1.1, -0.3, 0, 7); g.fill();
  g.restore();
  // steam — it's hot tea, after all
  g.fillStyle = "rgba(255,255,255,0.28)";
  for (let i = 0; i < 3; i++) {
    const t = frame * 0.08 + i * 2.1 + c.x * 0.05;
    g.beginPath();
    g.arc(c.x + Math.sin(t) * 4, c.y - c.r - 4 - i * 6, 3.6 - i * 0.9, 0, 7);
    g.fill();
  }
}

// The heroine: shoulder-length hair, England-flag shirt. x = center, y = feet.
function drawHeroine(x, y, dir, pose, phase) {
  g.save(); g.translate(x, y); g.scale(dir, 1);
  const sway = Math.sin(frame * 0.07) * 1.5;
  g.lineCap = "round";

  if (pose === "climb") {
    // back view on the ladder
    const c = Math.sin(phase * 2);
    g.strokeStyle = "#4a5d8a"; g.lineWidth = 5;                     // legs
    g.beginPath(); g.moveTo(-3, -12); g.lineTo(-6, 0 + c * 3); g.stroke();
    g.beginPath(); g.moveTo( 3, -12); g.lineTo( 6, 0 - c * 3); g.stroke();
    g.fillStyle = "#f4f4f8";                                        // shirt (back)
    g.beginPath(); g.roundRect(-8, -30, 16, 18, 4); g.fill();
    g.fillStyle = "#cc2233";
    g.fillRect(-1.7, -30, 3.4, 18); g.fillRect(-8, -24.5, 16, 3.2);
    g.strokeStyle = "#e8b992"; g.lineWidth = 4;                     // arms up
    g.beginPath(); g.moveTo(-6, -28); g.lineTo(-11, -40 - c * 5); g.stroke();
    g.beginPath(); g.moveTo( 6, -28); g.lineTo( 11, -40 + c * 5); g.stroke();
    g.fillStyle = "#6b4632";                                        // hair covers the head
    g.beginPath(); g.arc(0, -38, 9.5, 0, 7); g.fill();
    g.beginPath(); g.roundRect(-8, -40, 16, 18, 6); g.fill();
    g.restore(); return;
  }

  const wob = pose === "walk" ? Math.sin(phase * 2) : 0;
  const armUp = pose === "lift";
  // back arm
  g.strokeStyle = "#d8a982"; g.lineWidth = 4;
  if (armUp) { g.beginPath(); g.moveTo(-4, -28); g.lineTo(-7, -44); g.stroke(); }
  else { g.beginPath(); g.moveTo(-4, -28); g.lineTo(-7 - wob * 4, -16); g.stroke(); }
  // legs — jeans
  g.strokeStyle = "#4a5d8a"; g.lineWidth = 5;
  if (pose === "jump") {
    g.beginPath(); g.moveTo(-3, -12); g.lineTo(-8, -5); g.stroke();
    g.beginPath(); g.moveTo( 3, -12); g.lineTo( 7, -4); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-3, -12); g.lineTo(-4 - wob * 4, 0); g.stroke();
    g.beginPath(); g.moveTo( 3, -12); g.lineTo( 4 + wob * 4, 0); g.stroke();
  }
  // shoes
  g.fillStyle = "#7a4a2e";
  g.beginPath(); g.ellipse(-4 - wob * 4, 0, 4, 2.4, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse( 4 + wob * 4, 0, 4, 2.4, 0, 0, 7); g.fill();
  // torso — white shirt with St George's cross
  g.fillStyle = "#f4f4f8";
  g.beginPath(); g.roundRect(-8, -30, 16, 18, 4); g.fill();
  g.fillStyle = "#cc2233";
  g.fillRect(-1.7, -30, 3.4, 18);
  g.fillRect(-8, -24.5, 16, 3.2);
  // hair behind the head (falls just past the shoulders)
  g.fillStyle = "#6b4632";
  g.beginPath();
  g.moveTo(-9, -42);
  g.quadraticCurveTo(-12 + sway, -33, -10 + sway, -23);
  g.lineTo(-3, -26);
  g.quadraticCurveTo(-7, -35, -5, -43);
  g.closePath(); g.fill();
  g.beginPath(); g.ellipse(0, -41, 9.5, 8.5, 0, 0, 7); g.fill();    // hair cap
  // head
  g.fillStyle = "#e8b992";
  g.beginPath(); g.arc(2, -38, 8, 0, 7); g.fill();
  // bangs sweep
  g.fillStyle = "#6b4632";
  g.beginPath(); g.moveTo(-6, -42);
  g.quadraticCurveTo(2, -49, 9, -42);
  g.quadraticCurveTo(4, -44, -2, -41);
  g.closePath(); g.fill();
  // face
  g.fillStyle = "#3a2a20";
  g.beginPath(); g.arc(6, -39, 1.4, 0, 7); g.fill();                 // eye
  g.strokeStyle = "#6b4632"; g.lineWidth = 1.3;                      // brow
  g.beginPath(); g.moveTo(4, -42.5); g.lineTo(8, -42); g.stroke();
  g.strokeStyle = "#b3543f"; g.lineWidth = 1.4;                      // smile
  g.beginPath(); g.arc(6.5, -35.5, 2.4, 0.15, Math.PI * 0.7); g.stroke();
  g.fillStyle = "rgba(220,120,110,0.35)";                            // blush
  g.beginPath(); g.arc(8.6, -36.5, 1.8, 0, 7); g.fill();
  // front arm
  g.strokeStyle = "#e8b992"; g.lineWidth = 4;
  if (armUp) { g.beginPath(); g.moveTo(4, -28); g.lineTo(8, -45); g.stroke(); }
  else if (pose === "jump") { g.beginPath(); g.moveTo(4, -28); g.lineTo(11, -38); g.stroke(); }
  else { g.beginPath(); g.moveTo(4, -28); g.lineTo(8 + wob * 4, -15); g.stroke(); }
  g.restore();
}

// The Prez: blonde swoop, navy suit, very long red tie. x = center, y = feet.
// pose: "idle" | "throw" | "fly". rot spins him when airborne.
function drawPrez(x, y, pose, rot) {
  g.save(); g.translate(x, y);
  if (rot) { g.translate(0, -30); g.rotate(rot); g.translate(0, 30); }
  const bob = pose === "fly" ? 0 : Math.sin(frame * 0.05) * 1.2;
  g.translate(0, bob);
  g.lineCap = "round";
  // shoes
  g.fillStyle = "#241f1c";
  g.beginPath(); g.roundRect(-13, -4, 11, 5, 2); g.fill();
  g.beginPath(); g.roundRect(  2, -4, 11, 5, 2); g.fill();
  // legs
  g.strokeStyle = "#22304d"; g.lineWidth = 6;
  if (pose === "fly") {
    g.beginPath(); g.moveTo(-5, -16); g.lineTo(-11, -6); g.stroke();
    g.beginPath(); g.moveTo( 5, -16); g.lineTo( 11, -6); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-5, -16); g.lineTo(-6, -3); g.stroke();
    g.beginPath(); g.moveTo( 5, -16); g.lineTo( 6, -3); g.stroke();
  }
  // arms behind torso
  g.strokeStyle = "#22304d"; g.lineWidth = 6;
  if (pose === "throw") {
    g.beginPath(); g.moveTo(-11, -38); g.lineTo(-15, -26); g.stroke();
    g.beginPath(); g.moveTo( 11, -38); g.lineTo( 18, -52); g.stroke();
  } else if (pose === "fly") {
    const fl = Math.sin(frame * 0.4) * 4;
    g.beginPath(); g.moveTo(-11, -38); g.lineTo(-18, -48 - fl); g.stroke();
    g.beginPath(); g.moveTo( 11, -38); g.lineTo( 18, -48 + fl); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-11, -38); g.lineTo(-15, -24); g.stroke();
    g.beginPath(); g.moveTo( 11, -38); g.lineTo( 15, -24); g.stroke();
  }
  // torso — navy suit
  g.fillStyle = "#22304d";
  g.beginPath(); g.roundRect(-13, -43, 26, 28, 5); g.fill();
  // white shirt V
  g.fillStyle = "#f7f5ef";
  g.beginPath(); g.moveTo(-5, -43); g.lineTo(5, -43); g.lineTo(0, -28); g.closePath(); g.fill();
  // the very long red tie
  g.fillStyle = "#c42d2d";
  g.beginPath(); g.moveTo(-2.2, -41); g.lineTo(2.2, -41);
  g.lineTo(3.4, -23); g.lineTo(0, -17); g.lineTo(-3.4, -23); g.closePath(); g.fill();
  // hands
  g.fillStyle = "#efb183";
  if (pose === "throw") {
    g.beginPath(); g.arc(19, -53, 3, 0, 7); g.fill();
    // teacup in hand, ready to lob
    g.fillStyle = "#f4f1ea";
    g.beginPath(); g.roundRect(17, -64, 10, 8, 2); g.fill();
    g.fillStyle = "#a5691e";
    g.beginPath(); g.ellipse(22, -63.5, 4, 1.4, 0, 0, 7); g.fill();
    g.strokeStyle = "#f4f1ea"; g.lineWidth = 2;
    g.beginPath(); g.arc(28.5, -60, 2.6, Math.PI * 0.6, Math.PI * 1.4, true); g.stroke();
  } else if (pose === "fly") {
    const fl = Math.sin(frame * 0.4) * 4;
    g.beginPath(); g.arc(-19, -49 - fl, 3, 0, 7); g.fill();
    g.beginPath(); g.arc( 19, -49 + fl, 3, 0, 7); g.fill();
  } else {
    g.beginPath(); g.arc(-16, -23, 3, 0, 7); g.fill();
    g.beginPath(); g.arc( 16, -23, 3, 0, 7); g.fill();
  }
  // head
  g.fillStyle = "#efb183";
  g.beginPath(); g.arc(0, -53, 10, 0, 7); g.fill();
  // pursed mouth
  g.fillStyle = "#b3745a";
  g.beginPath(); g.ellipse(2, -47.5, 2.6, 1.6, 0, 0, 7); g.fill();
  // squinty eyes + fair brows
  g.fillStyle = "#3a5a8a";
  g.beginPath(); g.arc(-3.6, -54, 1.3, 0, 7); g.fill();
  g.beginPath(); g.arc( 4.4, -54, 1.3, 0, 7); g.fill();
  g.strokeStyle = "#e8c86a"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-6, -57); g.lineTo(-1.6, -56.5); g.stroke();
  g.beginPath(); g.moveTo( 2.4, -56.5); g.lineTo( 6.8, -57); g.stroke();
  // the blonde swoop
  g.fillStyle = "#f5d76e";
  g.beginPath();
  g.moveTo(-11, -54);
  g.quadraticCurveTo(-14, -64, -3, -65.5);
  g.quadraticCurveTo(8, -67, 13, -60);
  g.quadraticCurveTo(15.5, -55.5, 12, -52.5);
  g.quadraticCurveTo(13, -57, 8, -59);
  g.quadraticCurveTo(1, -61.5, -6, -59);
  g.quadraticCurveTo(-10, -57.5, -11, -54);
  g.closePath(); g.fill();
  g.beginPath();                                    // front flip of the swoop
  g.moveTo(6, -60);
  g.quadraticCurveTo(13, -60.5, 14, -55);
  g.quadraticCurveTo(11, -58, 5, -57.5);
  g.closePath(); g.fill();
  g.restore();
}

function drawDizzy(x, y) {
  for (let i = 0; i < 3; i++) {
    const a = frame * 0.15 + i * 2.1;
    g.fillStyle = "#ffe37a";
    g.save(); g.translate(x + Math.cos(a) * 16, y - 46 + Math.sin(a) * 5);
    g.rotate(a); g.font = "bold 13px monospace"; g.fillText("★", -5, 4); g.restore();
  }
}

function drawTossScene() {
  const p = player;
  if (tossT <= 45) {
    // hoisted overhead
    drawHeroine(p.x, p.y, 1, "lift", 0);
    drawPrez(p.x + 2, p.y - 46, "fly", Math.sin(frame * 0.2) * 0.12);
    g.fillStyle = "#fff"; g.font = "bold 15px 'Courier New', monospace";
    g.fillText("HEY!!", p.x + 24, p.y - 96);
  } else {
    drawHeroine(p.x, p.y, 1, tossT < 75 ? "lift" : "stand", 0);
    if (flung.x < W + 80 && flung.y < H + 80) {
      drawPrez(flung.x, flung.y, "fly", flung.rot);
      g.fillStyle = "#fff"; g.font = "bold 16px 'Courier New', monospace";
      g.fillText("AAAAA!", flung.x - 20, flung.y - 70);
    }
  }
  if (tossT > 80) {
    g.fillStyle = "rgba(10,12,40," + Math.min(0.4, (tossT - 80) / 250).toFixed(2) + ")";
    g.fillRect(0, 0, W, H);
    g.fillStyle = "#ffe9b0"; g.textAlign = "center";
    g.font = "bold 30px 'Courier New', monospace";
    g.fillText("Round " + round + " — overboard he goes!", W / 2, 330);
    g.font = "bold 18px 'Courier New', monospace";
    g.fillText("+" + (1000 + lives * 250) + " points", W / 2, 362);
    g.textAlign = "left";
  }
}

function drawHUD() {
  g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, 0, W, 34);
  g.fillStyle = "#ffe9b0"; g.font = "bold 17px 'Courier New', monospace";
  g.fillText("SCORE " + String(score).padStart(6, "0"), 14, 23);
  g.textAlign = "center"; g.fillText("ROUND " + round, W / 2, 23); g.textAlign = "left";
  g.fillStyle = "#ff8a9a";
  for (let i = 0; i < lives; i++) g.fillText("♥", W - 30 - i * 24, 24);
  if (muted) { g.fillStyle = "#8890b8"; g.fillText("MUTE", W - 130, 24); }
}

function drawTitle() {
  drawBackground();
  g.textAlign = "center";
  g.fillStyle = "#e9e9f2"; g.font = "bold 52px 'Courier New', monospace";
  g.fillText("SOPHIE'S TEA TIME", W / 2, 170);
  g.fillStyle = "#9aa0d0"; g.font = "bold 22px 'Courier New', monospace";
  g.fillText("a transatlantic climb", W / 2, 206);
  drawHeroine(W / 2 - 150, 400, 1, "stand", 0);
  drawPrez(W / 2 + 120, 402, "throw", 0);
  // a cup mid-flight between them
  drawCup({ x: W / 2 - 10, y: 330, r: 15, ang: frame * 0.1, falling: true });
  g.fillStyle = "#cfd2e8"; g.font = "bold 17px 'Courier New', monospace";
  g.fillText("The Prez is up top, lobbing giant cups of tea.", W / 2, 470);
  g.fillText("Help Sophie climb, dodge the china — and toss him overboard.", W / 2, 496);
  g.fillStyle = "#ffe9b0";
  g.fillText("← → move    ↑ ↓ ladders    SPACE jump", W / 2, 560);
  g.fillText("P pause    M mute", W / 2, 586);
  const blink = (frame % 70) < 45;
  if (blink) { g.font = "bold 24px 'Courier New', monospace"; g.fillText("PRESS ENTER TO START", W / 2, 650); }
  g.textAlign = "left";
}

function drawGameOver() {
  g.fillStyle = "rgba(5,6,20,0.75)"; g.fillRect(0, 0, W, H);
  g.textAlign = "center";
  g.fillStyle = "#ff8a9a"; g.font = "bold 44px 'Courier New', monospace";
  g.fillText("SOAKED IN TEA...", W / 2, 300);
  g.fillStyle = "#e9e9f2"; g.font = "bold 24px 'Courier New', monospace";
  g.fillText("SCORE " + score + "   ·   ROUND " + round, W / 2, 350);
  const blink = (frame % 70) < 45;
  if (blink) g.fillText("PRESS ENTER", W / 2, 420);
  g.textAlign = "left";
}

function draw() {
  if (state === "title") { drawTitle(); return; }
  drawBackground();
  drawLadders();
  drawPlatforms();
  if (state !== "toss") {
    const windup = spawnT < 24;
    drawPrez(PREZ_X, 168, windup ? "throw" : "idle", 0);
  }
  for (const c of cups) drawCup(c);
  if (state === "toss") {
    drawTossScene();
  } else {
    const p = player;
    const flash = invT > 0 && (invT % 8) < 4;
    if (!flash) {
      let pose = "stand";
      if (p.climbing) pose = "climb";
      else if (!p.grounded) pose = "jump";
      else if (left() || right()) pose = "walk";
      if (state === "dying") pose = "stand";
      drawHeroine(p.x, p.y, p.dir, pose, p.phase);
      if (state === "dying") drawDizzy(p.x, p.y);
    }
  }
  for (const f of floaters) {
    g.fillStyle = "rgba(255,233,176," + Math.min(1, f.t / 30).toFixed(2) + ")";
    g.font = "bold 15px 'Courier New', monospace";
    g.fillText(f.text, f.x - 14, f.y);
  }
  drawHUD();
  if (state === "gameover") drawGameOver();
  if (paused && state === "play") {
    g.fillStyle = "rgba(5,6,20,0.6)"; g.fillRect(0, 0, W, H);
    g.fillStyle = "#e9e9f2"; g.font = "bold 40px 'Courier New', monospace";
    g.textAlign = "center"; g.fillText("PAUSED", W / 2, H / 2); g.textAlign = "left";
  }
}

/* ---------------- main loop ---------------- */
function loop() {
  if (!paused || state !== "play") update();
  else frame++;
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
